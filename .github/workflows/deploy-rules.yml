name: Deploy security rules

# Started by hand: Actions tab → "Deploy security rules" → Run workflow.
# Deploys the rules on main to the live Firebase project, but only after the
# rules tests pass against the emulator.
#
# Needs a repository secret FIREBASE_SERVICE_ACCOUNT holding a service-account
# JSON key with roles Firebase Rules Admin and Service Usage Consumer, plus
# Cloud Storage for Firebase Viewer to deploy the Storage rules. See README.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which rules to deploy
        type: choice
        options:
          - firestore
          - storage
          - firestore and storage
        default: firestore

permissions:
  contents: read

# Never run two deploys at once.
concurrency:
  group: deploy-rules
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy rules
    runs-on: ubuntu-latest
    # Only deploy what has been merged.
    if: github.ref == 'refs/heads/main'
    env:
      FIREBASE_PROJECT: mycohub-mutha
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Test the rules before deploying
        run: npm run test:rules

      - name: Write the service-account key to a temporary file
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::The FIREBASE_SERVICE_ACCOUNT repository secret is not set. See README → Deploying security rules."
            exit 1
          fi
          key="$RUNNER_TEMP/firebase-sa.json"
          ( umask 077; printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key" )
          node -e "const k=require(process.argv[1]); if (k.type !== 'service_account') { console.error('::error::FIREBASE_SERVICE_ACCOUNT is not a service-account JSON key.'); process.exit(1) } console.log('Using service account', k.client_email, 'for project', k.project_id)" "$key"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            firestore) only="firestore:rules" ;;
            storage) only="storage" ;;
            "firestore and storage") only="firestore:rules,storage" ;;
            *) echo "::error::Unknown target: $TARGET"; exit 1 ;;
          esac
          echo "Deploying $only to $FIREBASE_PROJECT from $(git rev-parse --short HEAD)"
          npx firebase deploy --only "$only" --project "$FIREBASE_PROJECT" --non-interactive

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
